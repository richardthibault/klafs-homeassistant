<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <title>Klafs Sauna Icon</title>
  <!-- Fond avec dégradé chaud -->
  <defs>
    <linearGradient id="warmGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F7931E;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fond arrondi -->
  <rect width="256" height="256" rx="32" fill="url(#warmGradient)"/>
  
  <!-- Radiateur électrique (base) - agrandi et centré -->
  <rect x="76" y="140" width="104" height="52" rx="8" fill="#333"/>
  <!-- Barres du radiateur -->
  <rect x="86" y="148" width="8" height="36" fill="#888"/>
  <rect x="106" y="148" width="8" height="36" fill="#888"/>
  <rect x="126" y="148" width="8" height="36" fill="#888"/>
  <rect x="146" y="148" width="8" height="36" fill="#888"/>
  <rect x="166" y="148" width="8" height="36" fill="#888"/>
  
  <!-- Pierres chauffantes - agrandies -->
  <circle cx="96" cy="110" r="22" fill="#555"/>
  <circle cx="160" cy="110" r="22" fill="#555"/>
  <circle cx="128" cy="80" r="26" fill="#555"/>
  
  <!-- Ondes de chaleur stylisées -->
  <path d="M60,60 Q60,40 70,40 T80,60" stroke="white" fill="none" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  <path d="M90,50 Q90,30 100,30 T110,50" stroke="white" fill="none" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  <path d="M146,50 Q146,30 156,30 T166,50" stroke="white" fill="none" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  <path d="M176,60 Q176,40 186,40 T196,60" stroke="white" fill="none" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Banc en bas -->
  <rect x="32" y="200" width="192" height="24" rx="8" fill="#8B4513"/>
</svg>
